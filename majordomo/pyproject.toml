[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "majordomo"
version = "0.1.0"
description = "A personality-driven flight companion for Elite Dangerous"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]
dev = ["pytest>=8"]

[project.scripts]
majordomo = "majordomo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
majordomo = ["personas/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
